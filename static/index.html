<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lia · Empório da Música</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #1d2433; --muted: #6b7280; --line: #e4e1da;
    --navy: #1b4f72; --amber: #e8a13a; --user: #1b4f72; --bot: #f1efe9; --ok: #2f7d55; --err: #b3412f;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; cursor: pointer; }

  /* login */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 32px; width: min(380px, 100%); }
  .card h1 { margin: 0 0 4px; font-size: 22px; color: var(--navy); }
  .card p { margin: 0 0 20px; color: var(--muted); }
  .card input { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  .card button { width: 100%; margin-top: 12px; padding: 11px; border: 0; border-radius: 8px; background: var(--navy); color: #fff; }
  .card .err { color: var(--err); min-height: 1.5em; margin: 8px 0 0; font-size: 14px; }

  /* app */
  #app { display: none; height: 100vh; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--navy); color: #fff; }
  header strong { font-size: 17px; }
  header .tag { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: rgba(255,255,255,.15); }
  header .spacer { flex: 1; }
  header button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 8px; padding: 5px 12px; }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; padding: 16px; min-height: 0; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; }
  section > h2 { margin: 0; padding: 12px 16px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
  .side { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 16px; min-height: 0; }

  /* chat */
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 9px 13px; border-radius: 14px; white-space: normal; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .msg ul { margin: 4px 0; padding-left: 18px; }
  .typing { color: var(--muted); font-style: italic; }
  #chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 10px; }
  #chips button { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 4px 10px; font-size: 13px; color: var(--navy); }
  #chatForm { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  #chatForm input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  #chatForm button { border: 0; background: var(--amber); color: #1d2433; font-weight: 600; border-radius: 8px; padding: 0 18px; }
  #chatForm button:disabled { opacity: .5; cursor: default; }

  /* how-to strip and legend */
  .howto { display: flex; gap: 20px; flex-wrap: wrap; padding: 10px 20px; background: #fff; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .howto b { color: var(--navy); }
  .step { display: flex; gap: 8px; align-items: baseline; }
  .num { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block; }
  .card ul { margin: 0 0 18px; padding-left: 18px; color: var(--ink); font-size: 14px; }
  .card .hint { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .langs { display: inline-flex; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,.4); }
  .langs button { border: 0; background: transparent; color: #fff; padding: 5px 10px; font-size: 13px; }
  .langs button.on { background: var(--amber); color: #1d2433; font-weight: 700; }
  .card .langs { float: right; border-color: var(--line); }
  .card .langs button { color: var(--navy); background: transparent; width: auto; margin: 0; border-radius: 0; padding: 4px 10px; }
  .card .langs button.on { background: var(--navy); color: #fff; }

  /* neuron panel */
  #brain { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .turn { margin-bottom: 14px; }
  .turn-title { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .node { position: relative; padding: 0 0 12px 30px; animation: appear .35s ease-out; }
  .node::before { content: ""; position: absolute; left: 10px; top: 20px; bottom: 0; width: 2px; background: var(--line); }
  .node:last-child::before { display: none; }
  .dot { position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--c, var(--navy)); }
  .node.active .dot { animation: pulse 1s ease-in-out infinite; }
  .node .label { font-weight: 600; font-size: 13px; color: var(--c, var(--navy)); }
  .node .text { font-size: 13px; color: var(--ink); }
  .node code { font-family: var(--mono); font-size: 12px; background: #f3f1ec; padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  .node details { font-size: 12px; margin-top: 2px; }
  .node pre { font-family: var(--mono); font-size: 11px; background: #f3f1ec; padding: 8px; border-radius: 6px; max-height: 180px; overflow: auto; white-space: pre-wrap; }
  .t-received { --c: #6b7280; } .t-llm_call { --c: #7c4dbd; } .t-decision { --c: #1b4f72; }
  .t-tool_call { --c: #c27a12; } .t-tool_result { --c: #2f7d55; } .t-order { --c: #2f7d55; }
  .t-answer { --c: #1d2433; } .t-error { --c: var(--err); }
  .empty { color: var(--muted); font-size: 14px; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 55%, transparent); } 50% { box-shadow: 0 0 0 8px transparent; } }
  @keyframes appear { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* CRM */
  #crm { max-height: 200px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td:first-child, td:last-child { white-space: nowrap; }
  tr.new { animation: flash 2s ease-out; }
  @keyframes flash { from { background: #fdf0d8; } to { background: transparent; } }

  @media (max-width: 860px) {
    #app { height: auto; min-height: 100vh; }
    main { grid-template-columns: 1fr; padding: 12px; }
    header .tag { display: none; }
    #chat { height: 70vh; }
    #brain { max-height: 60vh; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>

<div id="login">
  <form class="card" id="loginForm">
    <div class="langs" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="pt">PT</button></div>
    <h1>Lia · Empório da Música</h1>
    <p data-i18n="subtitle"></p>
    <ul>
      <li data-i18n="li1"></li>
      <li data-i18n="li2"></li>
      <li data-i18n="li3"></li>
    </ul>
    <input id="pwd" type="password" data-i18n-ph="password" autocomplete="current-password" aria-label="Password" required>
    <button type="submit" data-i18n="enter"></button>
    <div class="err" id="loginErr" role="alert"></div>
    <p class="hint" data-i18n="hint"></p>
  </form>
</div>

<div id="app">
  <header>
    <strong>Lia · Empório da Música</strong>
    <span class="tag">gpt-5.4-mini · function calling</span>
    <span class="spacer"></span>
    <div class="langs" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="pt">PT</button></div>
    <button id="reset" data-i18n="reset"></button>
  </header>
  <div class="howto">
    <div class="step"><span class="num">1</span><span data-i18n-html="step1"></span></div>
    <div class="step"><span class="num">2</span><span data-i18n-html="step2"></span></div>
    <div class="step"><span class="num">3</span><span data-i18n-html="step3"></span></div>
  </div>
  <main>
    <section id="chat">
      <h2 data-i18n="chatTitle"></h2>
      <div id="messages" aria-live="polite"></div>
      <div id="chips"></div>
      <form id="chatForm">
        <input id="input" data-i18n-ph="placeholder" autocomplete="off" aria-label="Message" maxlength="1000">
        <button id="send" data-i18n="send"></button>
      </form>
    </section>
    <div class="side">
      <section>
        <h2 data-i18n="brainTitle"></h2>
        <div class="legend">
          <span class="t-llm_call"><i></i><span data-i18n="lgCall"></span></span>
          <span class="t-decision"><i></i><span data-i18n="lgDecision"></span></span>
          <span class="t-tool_call"><i></i><span data-i18n="lgTool"></span></span>
          <span class="t-tool_result"><i></i><span data-i18n="lgResult"></span></span>
          <span class="t-answer"><i></i><span data-i18n="lgAnswer"></span></span>
        </div>
        <div id="brain"><p class="empty" data-i18n="brainEmpty"></p></div>
      </section>
      <section>
        <h2 data-i18n="crmTitle"></h2>
        <div id="crm"><p class="empty" style="padding:12px 16px;margin:0" data-i18n="crmEmpty"></p></div>
      </section>
    </div>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch {} },
};
let password = store.get("pwd");
let sessionId = store.get("sid") || newId();
let busy = false;

// ---------- language (EN / PT): page texts, Lia's reply language and the brain explanations ----------
const I18N = {
  en: {
    subtitle: "AI customer service agent — Artefact AI Engineer case, by Nelson Araujo.",
    li1: "Chat with Lia, the store's assistant.", li2: "See, step by step, what the code does to answer.",
    li3: "Place an order and watch it land in the CRM.", password: "Password", enter: "Enter",
    hint: "The password is in the project README.", wrong: "Wrong password.", reset: "Reset",
    step1: "<b>Ask</b> something, or click an example below the chat.",
    step2: "<b>Watch the agent brain</b>: each step lights up as the code runs.",
    step3: "<b>Try buying</b>: Lia quotes, asks you to confirm, and the order appears in the CRM.",
    chatTitle: "Chat", placeholder: "Type your message…", send: "Send",
    brainTitle: "Agent brain · what the code is doing", lgCall: "model call", lgDecision: "model decision",
    lgTool: "Python tool runs", lgResult: "tool result", lgAnswer: "answer",
    brainEmpty: "Send a message to watch each step: model calls, tool choices, Python results and the final answer.",
    crmTitle: "CRM · orders created in this demo", crmEmpty: "No orders yet. Try: “I want to buy the Yamaha C40”.",
    greet: "Hi! I'm Lia, from Empório da Música 🎸 I can help with prices, stock, orders or questions about the store.",
    typing: "Lia is thinking…", fail: "Connection failed. Please try again.",
    reply: "Lia's reply is shown in the chat.", raw: "raw JSON returned to the model",
    crmHead: ["Order", "Customer", "Items", "Payment", "Total"],
    labels: { received: "Message received", llm_call: "Calling the model", decision: "Model decision",
              tool_call: "Running a tool", tool_result: "Tool result", order: "Order saved to CRM",
              answer: "Answer sent", error: "Error" },
    examples: ["How much is the Takamine GD20?", "Which acoustic guitars under R$1000?", "What's the store address?",
               "I want to buy the Yamaha C40", "Status of order 8, email anacarol.ferreira@coldmail.com",
               "Do you sell P10 cables?"],
  },
  pt: {
    subtitle: "Agente de atendimento com IA — case AI Engineer da Artefact, por Nelson Araujo.",
    li1: "Converse com a Lia, a assistente da loja.", li2: "Veja, passo a passo, o que o código faz para responder.",
    li3: "Faça um pedido e veja ele chegar no CRM.", password: "Senha", enter: "Entrar",
    hint: "A senha está no README do projeto.", wrong: "Senha incorreta.", reset: "Reiniciar",
    step1: "<b>Pergunte</b> algo, ou clique num exemplo abaixo do chat.",
    step2: "<b>Acompanhe o cérebro do agente</b>: cada passo acende enquanto o código roda.",
    step3: "<b>Teste uma compra</b>: a Lia orça, pede confirmação e o pedido aparece no CRM.",
    chatTitle: "Chat", placeholder: "Digite sua mensagem…", send: "Enviar",
    brainTitle: "Cérebro do agente · o que o código está fazendo", lgCall: "chamada ao modelo",
    lgDecision: "decisão do modelo", lgTool: "ferramenta Python", lgResult: "resultado", lgAnswer: "resposta",
    brainEmpty: "Mande uma mensagem para ver cada passo: chamadas ao modelo, escolha de ferramentas, resultados do Python e a resposta final.",
    crmTitle: "CRM · pedidos criados nesta demonstração", crmEmpty: "Nenhum pedido ainda. Tente: “Quero comprar o Yamaha C40”.",
    greet: "Oi! Eu sou a Lia, da Empório da Música 🎸 Posso te ajudar com preços, estoque, pedidos ou dúvidas sobre a loja.",
    typing: "Lia está pensando…", fail: "Falha de conexão. Tente de novo.",
    reply: "A resposta da Lia aparece no chat.", raw: "JSON bruto devolvido ao modelo",
    crmHead: ["Pedido", "Cliente", "Itens", "Pagamento", "Total"],
    labels: { received: "Mensagem recebida", llm_call: "Chamando o modelo", decision: "Decisão do modelo",
              tool_call: "Executando ferramenta", tool_result: "Resultado da ferramenta", order: "Pedido gravado no CRM",
              answer: "Resposta enviada", error: "Erro" },
    examples: ["Quanto custa o Takamine GD20?", "Quais violões até R$1000?", "Qual o endereço da loja?",
               "Quero comprar o Yamaha C40", "Status do pedido 8, e-mail anacarol.ferreira@coldmail.com",
               "Vocês vendem cabo P10?"],
  },
};
let lang = (() => { try { return localStorage.getItem("lang") || "en"; } catch { return "en"; } })();
const T = () => I18N[lang];

function applyLang(newLang) {
  lang = newLang;
  try { localStorage.setItem("lang", lang); } catch {}
  document.documentElement.lang = lang === "en" ? "en" : "pt-BR";
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = T()[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => { el.innerHTML = T()[el.dataset.i18nHtml]; });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = T()[el.dataset.i18nPh]; });
  document.querySelectorAll("[data-lang]").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
  $("chips").innerHTML = "";
  T().examples.forEach((t) => { const b = document.createElement("button"); b.textContent = t; b.onclick = () => send(t); $("chips").append(b); });
  const head = $("crm").querySelector("thead tr");
  if (head) head.innerHTML = T().crmHead.map((h) => `<th>${h}</th>`).join("");
  const msgs = $("messages").children;  // only the greeting so far: show it in the new language
  if (msgs.length === 1 && msgs[0].dataset.greet) msgs[0].textContent = T().greet;
}
document.querySelectorAll("[data-lang]").forEach((b) => { b.onclick = () => applyLang(b.dataset.lang); });

function newId() { const id = crypto.randomUUID(); store.set("sid", id); return id; }
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// minimal markdown: **bold**, `code`, "- " lists, line breaks
function md(text) {
  const lines = esc(text).split("\n");
  let html = "", inList = false;
  for (const raw of lines) {
    const line = raw.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
    if (/^\s*[-•] /.test(line)) { if (!inList) { html += "<ul>"; inList = true; } html += "<li>" + line.replace(/^\s*[-•] /, "") + "</li>"; }
    else { if (inList) { html += "</ul>"; inList = false; } html += line + "<br>"; }
  }
  return (html + (inList ? "</ul>" : "")).replace(/(<br>)+$/, "");
}

async function api(path, body) {
  return fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Password": password || "" },
                       body: JSON.stringify(body || { session_id: sessionId, message: "" }) });
}

// ---------- login ----------
async function enter(pwd) {
  password = pwd;
  const r = await api("/api/login");
  if (!r.ok) { $("loginErr").textContent = T().wrong; return; }
  store.set("pwd", pwd);
  $("login").style.display = "none";
  $("app").style.display = "flex";
  if (!$("messages").children.length) greet();
  $("input").focus();
}
$("loginForm").onsubmit = (e) => { e.preventDefault(); enter($("pwd").value); };
applyLang(lang);
if (password) enter(password);

// ---------- chat ----------
function addMsg(who, html) {
  const d = document.createElement("div");
  d.className = "msg " + who; d.innerHTML = html;
  $("messages").append(d); $("messages").scrollTop = 1e9;
  return d;
}
function greet() { addMsg("bot", esc(T().greet)).dataset.greet = "1"; }

$("chatForm").onsubmit = (e) => { e.preventDefault(); send($("input").value); };
$("reset").onclick = async () => {
  await api("/api/reset");
  sessionId = newId();
  $("messages").innerHTML = ""; $("brain").innerHTML = ""; greet();
};

// ---------- neuron panel ----------
let turnBox = null;
function startTurn(text) {
  if ($("brain").querySelector(".empty")) $("brain").innerHTML = "";
  turnBox = document.createElement("div");
  turnBox.className = "turn";
  turnBox.innerHTML = `<div class="turn-title">“${esc(text.slice(0, 80))}”</div>`;
  $("brain").append(turnBox);
}
function addNode(ev) {
  turnBox.querySelectorAll(".node.active").forEach((n) => n.classList.remove("active"));
  const n = document.createElement("div");
  n.className = `node t-${ev.type} ${ev.type === "answer" ? "" : "active"}`;
  let body = ev.explain ? esc(ev.explain) : "";
  if (ev.type === "tool_call") body = `<code>${esc(ev.tool)}(${esc(JSON.stringify(ev.arguments))})</code><br>` + body;
  if (ev.type === "tool_result") body += `<details><summary>${T().raw}</summary><pre>${esc(JSON.stringify(ev.result, null, 2))}</pre></details>`;
  if (ev.type === "answer") body = T().reply;
  if (ev.type === "order") body = `${esc(ev.order.order_id)} · R$ ${ev.order.total.toFixed(2)} · ${esc(ev.order.payment.method)}`;
  n.innerHTML = `<span class="dot"></span><div class="label">${T().labels[ev.type] || ev.type}</div><div class="text">${body}</div>`;
  turnBox.append(n);
  $("brain").scrollTop = 1e9;
}

// ---------- CRM ----------
function addOrder(o) {
  if (!$("crm").querySelector("table")) $("crm").innerHTML =
    `<table><thead><tr>${T().crmHead.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody></tbody></table>`;
  const items = o.items.map((i) => `${i.quantity}× ${esc(i.product)}`).join("<br>");
  const pay = o.payment.method + (o.payment.installments > 1 ? ` ${o.payment.installments}x` : "");
  const tr = document.createElement("tr");
  tr.className = "new";
  tr.innerHTML = `<td><b>${esc(o.order_id)}</b></td><td>${esc(o.customer.name)}<br><small>${esc(o.delivery_address)}</small></td>
                  <td>${items}</td><td>${esc(pay)}</td><td>R$ ${o.total.toFixed(2)}</td>`;
  $("crm").querySelector("tbody").prepend(tr);
}

async function send(text) {
  text = (text || "").trim();
  if (!text || busy) return;
  busy = true; $("send").disabled = true; $("input").value = "";
  addMsg("user", esc(text));
  const typing = addMsg("bot typing", T().typing);
  startTurn(text);
  try {
    const r = await api("/api/chat", { session_id: sessionId, message: text, lang });
    if (r.status === 401) { location.reload(); return; }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const ev = JSON.parse(buf.slice(0, i)); buf = buf.slice(i + 1);
        addNode(ev);
        if (ev.type === "order") addOrder(ev.order);
        if (ev.type === "answer") { typing.remove(); addMsg("bot", md(ev.text)); }
      }
    }
  } catch (e) {
    typing.remove(); addMsg("bot", T().fail);
  } finally {
    busy = false; $("send").disabled = false; $("input").focus();
  }
}
</script>
</body>
</html>
